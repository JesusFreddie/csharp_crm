services:
  api:
    image: api
    user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: src/API/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=crm;Username=crm;Password=crm

  postgres:
    image: postgres:16
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
  migrator:
    build:
      context: .
      dockerfile: src/Migrator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=crm;Username=crm;Password=crm
volumes:
  postgres_data:
